<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eraser · Machine unlearning, proved by audit</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <rect x="4" y="6" width="6" height="20" fill="#3987e5"/><rect x="12" y="6" width="6" height="20" fill="#fab219"/>
      <rect x="20" y="6" width="6" height="20" fill="none" stroke="#d03b3b" stroke-width="2" stroke-dasharray="3 2"/>
    </svg>
    <div>
      <div class="name">Eraser</div>
      <div class="tag">Deletes one patient from a trained model without a full retrain, then proves it with a membership-inference audit</div>
    </div>
  </div>
  <div class="actions"><span id="wschip" class="chip"></span></div>
</header>
<main>
  <nav class="tabs" id="tabs">
    <button data-tab="shards" class="active">Shards</button>
    <button data-tab="delete">Delete a patient</button>
    <button data-tab="log">Deletion log</button>
    <button data-tab="sweep">Evidence</button>
    <button data-tab="how">How it works</button>
  </nav>
  <div id="view"></div>
</main>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
